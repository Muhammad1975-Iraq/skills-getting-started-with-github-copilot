<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIXIOS Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Operations Center</p>
        <h1>RIXIOS Activity Dashboard</h1>
      </div>
      <div class="header-actions">
        <button id="download-excel" class="secondary-button">Download Excel</button>
        <span class="status-pill">Live</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel overview-panel">
        <div class="panel-heading">
          <h2>Overview</h2>
          <span>Updated in real time</span>
        </div>
        <div id="summary-cards" class="summary-grid"></div>
      </section>

      <section class="panel dashboard-panel">
        <div class="panel-heading">
          <h2>Activities</h2>
          <span>Participation insights</span>
        </div>
        <div id="activity-grid" class="activity-grid"></div>
      </section>

      <aside class="panel side-panel">
        <div class="panel-heading">
          <h2>Recent Signups</h2>
          <span>Latest activity</span>
        </div>
        <ul id="recent-signups" class="recent-list"></ul>

        <div class="signup-box">
          <h3>Register Student</h3>
          <form id="signup-form">
            <div class="form-group">
              <label for="email">Student Email</label>
              <input type="email" id="email" required placeholder="student@mergington.edu" />
            </div>
            <div class="form-group">
              <label for="activity">Select Activity</label>
              <select id="activity" required>
                <option value="">-- Select an activity --</option>
              </select>
            </div>
            <button type="submit">Sign Up</button>
          </form>
          <div id="message" class="message hidden"></div>
        </div>
      </aside>
    </main>

    <footer>
      <p>RIXIOS Student Programs</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
